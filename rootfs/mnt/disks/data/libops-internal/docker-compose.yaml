networks:
  internal:
services:
  lightsout:
    profiles:
      - lightsout
    image: ghcr.io/libops/lightsout:main@sha256:4d38ac380c86514d72efbcce0af9ea8ffd7ff86e97abea3d0b3c946cf204eaae
    ports:
      - "8808:8808"
    networks:
      - internal
    restart: unless-stopped
    environment:
      INACTIVITY_TIMEOUT: 90
      GCP_PROJECT: ${GCP_PROJECT}
      GCP_ZONE: ${GCP_ZONE}
      GCP_INSTANCE_NAME: ${GCP_INSTANCE_NAME}
      GOOGLE_APPLICATION_CREDENTIALS: /app/GOOGLE_APPLICATION_CREDENTIALS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/disks/data:/mnt/disks/data
      - ./GOOGLE_APPLICATION_CREDENTIALS:/app/GOOGLE_APPLICATION_CREDENTIALS:r
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    command:
      - -disable_metrics
      - cpu_topology,referenced_memory,disk,memory_numa,perf_event,sched,tcp,udp
      - -store_container_labels
      - "false"
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - internal
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /mnt/disks/data/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
  cap:
    image: ghcr.io/libops/cap:main@sha256:13959cc4c78dec2ffff0c4c45d05d85587d08dc50c0cc40cb6088c4ead381ad4
    command: ["/app/binary"]
    networks:
      - internal
    restart: unless-stopped
    environment:
      GCP_PROJECT: ${GCP_PROJECT}
      GCP_ZONE: ${GCP_ZONE}
      GCP_INSTANCE_NAME: ${GCP_INSTANCE_NAME}
      CADVISOR_HOST: "cadvisor:8080"
      GOOGLE_APPLICATION_CREDENTIALS: /app/GOOGLE_APPLICATION_CREDENTIALS
    volumes:
      - ./GOOGLE_APPLICATION_CREDENTIALS:/app/GOOGLE_APPLICATION_CREDENTIALS:r
    depends_on:
      - cadvisor
