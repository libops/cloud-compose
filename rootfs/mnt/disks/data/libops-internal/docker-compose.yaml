networks:
  internal:
services:
  lightsout:
    profiles:
      - lightsout
    image: ${LIBOPS_LIGHTSOUT_IMAGE:-ghcr.io/libops/lightsout:main}
    ports:
      - "8808:8808"
    networks:
      - internal
    restart: unless-stopped
    environment:
      INACTIVITY_TIMEOUT: 90
      GCP_PROJECT: ${GCP_PROJECT}
      GCP_ZONE: ${GCP_ZONE}
      GCP_INSTANCE_NAME: ${GCP_INSTANCE_NAME}
      GOOGLE_APPLICATION_CREDENTIALS: /app/GOOGLE_APPLICATION_CREDENTIALS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/disks/data:/mnt/disks/data
      - ./GOOGLE_APPLICATION_CREDENTIALS:/app/GOOGLE_APPLICATION_CREDENTIALS:r
  cadvisor:
    image: ${LIBOPS_CADVISOR_IMAGE:-ghcr.io/google/cadvisor:v0.57.0@sha256:e75bdb03b74b0b6995f208f166fead2e6e555dde73e44200113bb26f41b1981d}
    command:
      - -disable_metrics
      - cpu_topology,referenced_memory,disk,memory_numa,perf_event,sched,tcp,udp
      - -store_container_labels
      - "false"
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - internal
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /mnt/disks/data/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
  cap:
    image: ${LIBOPS_CAP_IMAGE:-ghcr.io/libops/cap:main}
    networks:
      - internal
    restart: unless-stopped
    environment:
      GCP_PROJECT: ${GCP_PROJECT}
      GCP_ZONE: ${GCP_ZONE}
      GCP_INSTANCE_NAME: ${GCP_INSTANCE_NAME}
      CADVISOR_HOST: "cadvisor:8080"
      GOOGLE_APPLICATION_CREDENTIALS: /app/GOOGLE_APPLICATION_CREDENTIALS
    volumes:
      - ./GOOGLE_APPLICATION_CREDENTIALS:/app/GOOGLE_APPLICATION_CREDENTIALS:r
    depends_on:
      - cadvisor
