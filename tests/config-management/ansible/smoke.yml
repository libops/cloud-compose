- name: Smoke cloud-compose Ansible role
  hosts: localhost
  gather_facts: true
  vars:
    cloud_compose_name: isle-prod
    cloud_compose_template: isle
    cloud_compose_install_packages: false
    cloud_compose_reload_systemd: false
    cloud_compose_run_bootstrap: false
    cloud_compose_dedicated_host_acknowledged: true
    cloud_compose_managed_runtime_enabled: true
    cloud_compose_internal_services_enabled: true
    cloud_compose_internal_services_auto_update: true
    cloud_compose_runtime:
      extra_env:
        BASH_ENV: /tmp/cloud-compose-ansible-untrusted-bash-env
        LD_PRELOAD: /tmp/cloud-compose-ansible-untrusted-preload.so
        PORT: "9999"
        CONTRACT_BACKTICKS: '`touch /tmp/cloud-compose-ansible-backtick-injection`'
        CONTRACT_BACKSLASH: "a\\path\\ends\\"
        CONTRACT_COMMAND_SUB: '$(touch /tmp/cloud-compose-ansible-command-injection)'
        CONTRACT_DOLLARS: '$HOME ${HOME}'
        CONTRACT_QUOTES: 'a "double" and a single quote: O''Reilly'
        CONTRACT_WHITESPACE: '  leading and trailing  '
        CONTRACT_MULTILINE: |-
          line one
          line two
      compose:
        project_dir: /mnt/disks/data/libops/isle/main
        init: []
        up:
          - global-up-command
        down:
          - global-down-command
        rollout:
          - global-rollout-command
        ingress:
          domain: isle.example.edu
          acme_email: admin@example.edu
        projects:
          isle-prod:
            docker_compose_repo: https://github.com/libops/isle
            project_dir: /mnt/disks/data/libops/isle/main
            docker_compose_up: []
            docker_compose_down:
              - app-down-command
      sitectl:
        environment: production
        package_versions:
          sitectl-drupal: v0.11.0
          sitectl-isle: v0.12.0
      managed_runtime:
        enabled: false
        internal_services_enabled: false
        internal_services_auto_update: false
        artifacts:
          - name: contract-agent
            url: https://example.invalid/contract-agent
            sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            path: /usr/local/bin/contract-agent
            mode: "0750"
            owner: root
            group: root
            restart: cloud-compose.service
  roles:
    - role: cloud_compose
  post_tasks:
    - name: Validate rendered compose project manifest JSON
      ansible.builtin.command:
        cmd: python3 -m json.tool /home/cloud-compose/compose-projects.json
      changed_when: false

    - name: Read rendered cloud-compose environment
      ansible.builtin.slurp:
        src: /home/cloud-compose/.env
      register: cloud_compose_env_file

    - name: Read rendered Compose application environment
      ansible.builtin.slurp:
        src: /home/cloud-compose/application-env.json
      register: cloud_compose_application_env_file

    - name: Read rendered compose project manifest
      ansible.builtin.slurp:
        src: /home/cloud-compose/compose-projects.json
      register: cloud_compose_manifest_file

    - name: Read rendered managed artifact manifest
      ansible.builtin.slurp:
        src: /home/cloud-compose/managed-runtime-artifacts.tsv
      register: cloud_compose_artifact_manifest_file

    - name: Assert rendered Ansible runtime contract
      ansible.builtin.assert:
        that:
          - >-
            'CLOUD_COMPOSE_PROVIDER="onprem"' in (cloud_compose_env_file.content | b64decode)
          - >-
            'DOCKER_COMPOSE_DIR="/mnt/disks/data/libops/isle/main"' in (cloud_compose_env_file.content | b64decode)
          - >-
            'DOCKER_COMPOSE_REPO="https://github.com/libops/isle"' in (cloud_compose_env_file.content | b64decode)
          - >-
            'SITECTL_PLUGIN="isle"' in (cloud_compose_env_file.content | b64decode)
          - '"sitectl-isle" in (cloud_compose_env_file.content | b64decode)'
          - '"SITECTL_PACKAGE_VERSIONS" in (cloud_compose_env_file.content | b64decode)'
          - >-
            'LIBOPS_MANAGED_RUNTIME_ENABLED="false"' in (cloud_compose_env_file.content | b64decode)
          - >-
            'LIBOPS_INTERNAL_SERVICES_ENABLED="false"' in (cloud_compose_env_file.content | b64decode)
          - >-
            'LIBOPS_INTERNAL_SERVICES_AUTO_UPDATE="false"' in (cloud_compose_env_file.content | b64decode)
          - "'BASH_ENV' not in (cloud_compose_env_file.content | b64decode)"
          - "'LD_PRELOAD' not in (cloud_compose_env_file.content | b64decode)"
          - "not (cloud_compose_env_file.content | b64decode).startswith('PORT=')"
          - "'\nPORT=' not in (cloud_compose_env_file.content | b64decode)"
          - '(cloud_compose_application_env_file.content | b64decode | from_json).BASH_ENV == "/tmp/cloud-compose-ansible-untrusted-bash-env"'
          - '(cloud_compose_application_env_file.content | b64decode | from_json).LD_PRELOAD == "/tmp/cloud-compose-ansible-untrusted-preload.so"'
          - '(cloud_compose_application_env_file.content | b64decode | from_json).PORT == "9999"'
          - '(cloud_compose_manifest_file.content | b64decode | from_json)["isle-prod"].docker_compose_repo == "https://github.com/libops/isle"'
          - '(cloud_compose_manifest_file.content | b64decode | from_json)["isle-prod"].project_dir == "/mnt/disks/data/libops/isle/main"'
          - '(cloud_compose_manifest_file.content | b64decode | from_json)["isle-prod"].ingress.domain == "isle.example.edu"'
          - '(cloud_compose_manifest_file.content | b64decode | from_json)["isle-prod"].sitectl_plugin == "isle"'
          - '(cloud_compose_manifest_file.content | b64decode | from_json)["isle-prod"].init_commands == []'
          - '(cloud_compose_manifest_file.content | b64decode | from_json)["isle-prod"].up_commands == []'
          - '(cloud_compose_manifest_file.content | b64decode | from_json)["isle-prod"].down_commands == ["app-down-command"]'
          - '(cloud_compose_manifest_file.content | b64decode | from_json)["isle-prod"].rollout_commands == ["global-rollout-command"]'
          - >-
            'contract-agent\thttps://example.invalid/contract-agent\taaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\t/usr/local/bin/contract-agent\t0750\troot\troot\tcloud-compose.service' in (cloud_compose_artifact_manifest_file.content | b64decode)
