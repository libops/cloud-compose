- name: Reject a Compose project directory that escapes through a symlink
  hosts: localhost
  gather_facts: true
  vars:
    cloud_compose_name: invalid-project-dir-symlink
    cloud_compose_template: wp
    cloud_compose_dedicated_host_acknowledged: true
    cloud_compose_install_packages: false
    cloud_compose_reload_systemd: false
    cloud_compose_run_bootstrap: false
    cloud_compose_runtime:
      compose:
        project_dir: /mnt/disks/data/escape/site
  roles:
    - role: cloud_compose
