- name: Reject GCP-only internal services on an on-prem host
  hosts: localhost
  gather_facts: true
  vars:
    cloud_compose_name: invalid-internal-services
    cloud_compose_template: wp
    cloud_compose_dedicated_host_acknowledged: true
    cloud_compose_install_packages: false
    cloud_compose_reload_systemd: false
    cloud_compose_run_bootstrap: false
    cloud_compose_runtime:
      managed_runtime:
        internal_services_enabled: true
  roles:
    - role: cloud_compose
