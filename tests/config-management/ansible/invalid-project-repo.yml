- name: Reject cloud-compose projects without repositories
  hosts: localhost
  gather_facts: true
  vars:
    cloud_compose_name: invalid-project-repo
    cloud_compose_dedicated_host_acknowledged: true
    cloud_compose_install_packages: false
    cloud_compose_reload_systemd: false
    cloud_compose_run_bootstrap: false
    cloud_compose_runtime:
      compose:
        projects:
          wp:
            ingress_port: 80
  roles:
    - role: cloud_compose
