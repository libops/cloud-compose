- name: Reject an unknown cloud-compose template
  hosts: localhost
  gather_facts: true
  vars:
    cloud_compose_name: invalid-template
    cloud_compose_template: wordpres
    cloud_compose_dedicated_host_acknowledged: true
    cloud_compose_install_packages: false
    cloud_compose_reload_systemd: false
    cloud_compose_run_bootstrap: false
  roles:
    - role: cloud_compose
