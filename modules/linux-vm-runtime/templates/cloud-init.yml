#cloud-config

groups:
- docker

users:
- name: cloud-compose
  shell: /bin/bash
  groups:
  - docker
  sudo:
  - ALL=(root) NOPASSWD:/usr/bin/systemctl start cloud-compose.service,/usr/bin/systemctl stop cloud-compose.service,/usr/bin/systemctl restart cloud-compose.service,/usr/bin/systemctl status cloud-compose.service
  - ALL=(root) NOPASSWD:/etc/cloud-compose/bin/cloud-compose-diagnostics.sh state
  - ALL=(root) NOPASSWD:/etc/cloud-compose/bin/cloud-compose-diagnostics.sh status
  - ALL=(root) NOPASSWD:/etc/cloud-compose/bin/cloud-compose-diagnostics.sh dump
%{ if length(CLOUD_COMPOSE_SSH_KEYS) > 0 ~}
  ssh_authorized_keys:
%{ for key in CLOUD_COMPOSE_SSH_KEYS ~}
  - ${jsonencode(key)}
%{ endfor ~}
%{ endif ~}
%{ for username, ssh_keys in SSH_USERS ~}
- name: ${jsonencode(username)}
  shell: /bin/bash
  ssh_authorized_keys:
%{ for key in ssh_keys ~}
  - ${jsonencode(key)}
%{ endfor ~}
%{ endfor ~}

write_files:
- path: /var/lib/cloud-compose/bootstrap/rootfs-archive.sh
  owner: root:root
  permissions: "0700"
  encoding: gzip+base64
  content: ${ROOTFS_ARCHIVE_SCRIPT_B64}
%{ if ROOTFS_ARCHIVE_ENABLED ~}
- path: /var/lib/cloud-compose/bootstrap/linux-vm-cloud-init.sh
  owner: root:root
  permissions: "0700"
  encoding: gzip+base64
  content: ${LINUX_CLOUD_INIT_SCRIPT_B64}
%{ endif ~}
- path: /var/lib/cloud-compose/bootstrap/cloud-compose-diagnostics.sh
  owner: root:root
  permissions: "0600"
  encoding: gzip+base64
  content: ${DIAGNOSTICS_SCRIPT_B64}
${WRITE_FILES_CONTENT}
${DOCKER_COMPOSE_SCRIPTS}
${COMPOSE_PROJECTS_FILE}
${ENV_FILE_CONTENT}
${APPLICATION_ENV_FILE_CONTENT}
${VAULT_AGENT_FILES}
${MANAGED_RUNTIME_ARTIFACTS_FILE}

runcmd:
%{ if ROOTFS_ARCHIVE_ENABLED ~}
%{ if ROOTFS_TEST_SOURCE_ARCHIVE_PREFIX != "" ~}
- [bash, /var/lib/cloud-compose/bootstrap/rootfs-archive.sh, prepare-linux-test-source, ${jsonencode(ROOTFS_ARCHIVE_URL_B64)}, ${jsonencode(ROOTFS_ARCHIVE_SHA256)}, ${jsonencode(ROOTFS_CONTRACT_SHA256)}, ${jsonencode(LINUX_CLOUD_INIT_SCRIPT_SHA256)}, ${jsonencode(ROOTFS_TEST_SOURCE_ARCHIVE_PREFIX)}]
%{ else ~}
- [bash, /var/lib/cloud-compose/bootstrap/rootfs-archive.sh, prepare-linux, ${jsonencode(ROOTFS_ARCHIVE_URL_B64)}, ${jsonencode(ROOTFS_ARCHIVE_SHA256)}, ${jsonencode(ROOTFS_CONTRACT_SHA256)}, ${jsonencode(LINUX_CLOUD_INIT_SCRIPT_SHA256)}]
%{ endif ~}
- [bash, /var/lib/cloud-compose/bootstrap/linux-vm-cloud-init.sh, ${jsonencode(DATA_DEVICE)}, ${jsonencode(VOLUMES_DEVICE)}, "true", ${jsonencode(ROLLOUT_ENABLED)}, ${jsonencode(DIAGNOSTICS_SCRIPT_SHA256)}]
%{ else ~}
- [bash, /etc/cloud-compose/libexec/linux-vm-cloud-init.sh, ${jsonencode(DATA_DEVICE)}, ${jsonencode(VOLUMES_DEVICE)}, "false", ${jsonencode(ROLLOUT_ENABLED)}, ${jsonencode(DIAGNOSTICS_SCRIPT_SHA256)}]
%{ endif ~}
