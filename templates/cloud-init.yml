#cloud-config

groups:
- docker

users:
- name: cloud-compose
  shell: /bin/bash
  groups:
  - docker
  sudo:
  - ALL=(root) NOPASSWD:/usr/bin/systemctl start cloud-compose.service,/usr/bin/systemctl stop cloud-compose.service,/usr/bin/systemctl restart cloud-compose.service,/usr/bin/systemctl status cloud-compose.service
  - ALL=(root) NOPASSWD:/etc/cloud-compose/bin/cloud-compose-diagnostics.sh state
  - ALL=(root) NOPASSWD:/etc/cloud-compose/bin/cloud-compose-diagnostics.sh status
  - ALL=(root) NOPASSWD:/etc/cloud-compose/bin/cloud-compose-diagnostics.sh dump
%{ if length(CLOUD_COMPOSE_SSH_KEYS) > 0 ~}
  ssh_authorized_keys:
%{ for key in CLOUD_COMPOSE_SSH_KEYS ~}
  - ${jsonencode(key)}
%{ endfor ~}
%{ endif ~}
%{ for username, ssh_keys in SSH_USERS ~}
- name: ${jsonencode(username)}
  shell: /bin/bash
  ssh_authorized_keys:
%{ for key in ssh_keys ~}
  - ${jsonencode(key)}
%{ endfor ~}
%{ endfor ~}

write_files:
- path: /var/lib/cloud-compose/bootstrap/install-rootfs.py
  owner: root:root
  permissions: "0700"
  encoding: gzip+base64
  content: ${ROOTFS_INSTALLER_B64}
- path: /var/lib/cloud-compose/bootstrap/rootfs.json
  owner: root:root
  permissions: "0600"
  encoding: gzip+base64
  content: ${ROOTFS_BUNDLE_B64}
- path: /var/lib/cloud-compose/bootstrap/init-commands.sh
  owner: root:root
  permissions: "0600"
  encoding: b64
  content: ${jsonencode(INIT_COMMANDS_B64)}
- path: /var/lib/cloud-compose/bootstrap/runcmd.sh
  owner: root:root
  permissions: "0600"
  encoding: b64
  content: ${jsonencode(RUNCMD_B64)}
${DOCKER_COMPOSE_SCRIPTS}
${COMPOSE_PROJECTS_FILE}
${ENV_FILE_CONTENT}
${APPLICATION_ENV_FILE_CONTENT}
${VAULT_AGENT_FILES}
${MANAGED_RUNTIME_ARTIFACTS_FILE}

runcmd:
- [python3, /var/lib/cloud-compose/bootstrap/install-rootfs.py, /var/lib/cloud-compose/bootstrap/rootfs.json]
- [bash, /etc/cloud-compose/libexec/gcp-cloud-init-finalize.sh, /var/lib/cloud-compose/bootstrap/init-commands.sh]
%{ if POST_BOOTSTRAP_REQUIRED ~}
- [bash, /etc/cloud-compose/libexec/gcp-cloud-init-post-bootstrap.sh, ${jsonencode(ROLLOUT_ENABLED)}, /var/lib/cloud-compose/bootstrap/runcmd.sh]
%{ endif ~}
